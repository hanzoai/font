name: Publish

on:
  push:
    branches: [main]
    # No `paths:` filter. There is ONE question — "does npmjs serve something
    # older than this tree?" — and the step below answers it against the
    # registry. A path gate is a second, worse answer to the same question,
    # guessed from the shape of a diff, and it can veto a release that should
    # have gone out. Reading the registry is idempotent: nothing ahead of npmjs
    # means nothing to publish.
  workflow_dispatch:

jobs:
  publish:
    runs-on: linux-amd64
    steps:
      - uses: actions/checkout@v4
      # No pnpm and no `install`. This repo has ONE package and no root
      # manifest, workspace or lockfile — `pnpm install` exits non-zero with
      # nothing to install and takes the job with it, which is why 1.8.3 sat
      # unpublished while the identical shape worked in hanzoai/ui. The package
      # has no build step either: dist/ is committed, and the only generated
      # file is checked below.
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: 'https://registry.npmjs.org'

      - name: Is this tree ahead of npmjs?
        id: v
        run: |
          NEW=$(jq -r .version packages/zen/package.json)
          OLD=$(curl -sf https://registry.npmjs.org/@hanzo%2Ffont \
                  | jq -r '."dist-tags".latest // "0.0.0"' || echo 0.0.0)
          # FORWARD ONLY. `!=` fires in both directions, and a revert would walk
          # the registry backwards.
          NEWEST=$(printf '%s\n%s\n' "$OLD" "$NEW" | sort -V | tail -1)
          if [ "$OLD" != "$NEW" ] && [ "$NEWEST" = "$NEW" ]; then
            echo "ship=1" >> $GITHUB_OUTPUT
            echo "want=$NEW" >> $GITHUB_OUTPUT
            echo "@hanzo/font $OLD -> $NEW"
          else
            echo "npmjs serves $OLD, tree says $NEW — nothing to do"
          fi

      - name: Fetch the npm token from KMS
        if: steps.v.outputs.ship
        id: tok
        # KMS is where a secret lives. Same org path and machine identity every
        # other workflow here uses, so there is nothing new to rotate and no npm
        # credential stored on the forge.
        env:
          KMS_CLIENT_ID: ${{ secrets.KMS_CLIENT_ID }}
          KMS_CLIENT_SECRET: ${{ secrets.KMS_CLIENT_SECRET }}
          KMS_ENDPOINT: ${{ vars.KMS_ENDPOINT || 'https://kms.hanzo.ai' }}
          KMS_SECRET_ENV: ${{ vars.KMS_SECRET_ENV || 'prod' }}
          KMS_NPM_PATH: ${{ vars.KMS_NPM_PATH || '' }}
        run: |
          # Build the body with jq so a quote or backslash in the secret cannot
          # break the JSON — a hand-interpolated "{\"clientId\":\"$X\"}" does.
          body=$(jq -nc --arg id "$KMS_CLIENT_ID" --arg sec "$KMS_CLIENT_SECRET" \
                   '{clientId:$id, clientSecret:$sec}')
          # No -f here either, for the same reason it is absent below: -f throws
          # the body away, so a failure arrives as `jq: Invalid numeric literal`
          # with no status and no message. That cost a whole run to diagnose.
          # Capture the status and the body, and say which one was wrong.
          out=$(curl -sS -w '\n%{http_code}' "${KMS_ENDPOINT}/v1/kms/auth/login" \
                  -H 'Content-Type: application/json' --data-binary "$body")
          code=${out##*$'\n'}
          resp=${out%$'\n'*}
          if [ "$code" != "200" ]; then
            echo "::error::KMS login returned HTTP $code at ${KMS_ENDPOINT}: $(printf '%s' "$resp" | head -c 200)"
            exit 1
          fi
          token=$(printf '%s' "$resp" | jq -r '.accessToken // empty' 2>/dev/null || true)
          [ -n "$token" ] || {
            echo "::error::KMS login was 200 but carried no accessToken: $(printf '%s' "$resp" | head -c 200)"
            exit 1
          }
          # Org-scoped by the token's owner claim, not by a path segment. The
          # flat form answers {name, env, value}; the older
          # /v1/kms/orgs/<org>/secrets/… form 404s here.
          url="${KMS_ENDPOINT}/v1/kms/secrets/${KMS_NPM_PATH:+${KMS_NPM_PATH}/}NPM_TOKEN?env=${KMS_SECRET_ENV}"
          # No -f: a 404 must say WHICH path was empty, not just exit 22.
          npm_token=$(curl -sS "$url" -H "Authorization: Bearer ${token}" | jq -r '.value // empty')
          [ -n "$npm_token" ] || { echo "::error::No NPM_TOKEN at $url"; exit 1; }
          echo "::add-mask::${npm_token}"
          echo "token=${npm_token}" >> "$GITHUB_OUTPUT"

      - name: Build and publish
        if: steps.v.outputs.ship
        env:
          NODE_AUTH_TOKEN: ${{ steps.tok.outputs.token }}
          WANT: ${{ steps.v.outputs.want }}
        run: |
          set -uo pipefail
          # The presets are GENERATED. Publishing without regenerating ships a
          # dist/presets.css that disagrees with scripts/presets.mjs, and the
          # disagreement is invisible — both files are valid CSS.
          node packages/zen/scripts/presets.mjs
          git diff --quiet packages/zen/dist/presets.css || {
            echo "::error::dist/presets.* is stale — run scripts/presets.mjs and commit"
            exit 1
          }

          # Every face the package promises must actually be in the tarball. An
          # exports entry pointing at a file that is not packed resolves at
          # install time and 404s at run time, and the fallback is the platform
          # sans — the exact failure this typeface exists to prevent.
          for f in dist/fonts/zen-sans/Zen-Variable.woff2 \
                   dist/fonts/zen-mono/ZenMono-Variable.woff2 \
                   dist/presets.css dist/presets.js; do
            [ -s "packages/zen/$f" ] || { echo "::error::missing $f"; exit 1; }
          done

          OUT=$(cd packages/zen && npm publish --access public 2>&1)
          PUB=$?; echo "$OUT"
          case "$OUT" in
            *EPUBLISHCONFLICT*|*"cannot publish over"*)
              echo "::notice::already on npmjs at $WANT"; exit 0 ;;
          esac

          # npmjs is read-after-write eventually consistent, so a publish that
          # worked can be unreadable for a few seconds. A false red is worse
          # than a slow green: it reports a release that happened as failed, and
          # the next person burns a version number over it.
          for i in 1 2 3 4 5 6; do
            npm view "@hanzo/font@$WANT" version >/dev/null 2>&1 && {
              echo "published @hanzo/font@$WANT"; exit 0; }
            echo "not visible yet ($i/6); waiting 10s"; sleep 10
          done
          echo "::error::@hanzo/font@$WANT is not on npmjs 60s after publish (exit $PUB)"
          exit 1
